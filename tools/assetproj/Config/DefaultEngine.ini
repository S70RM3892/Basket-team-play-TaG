[/Script/EngineSettings.GameMapsSettings]
EditorStartupMap=/Engine/Maps/Entry
GameDefaultMap=/Engine/Maps/Entry

[ConsoleVariables]
; The import script uses the legacy FBX importer (exact control over sockets, normals and material slots).
Interchange.FeatureFlags.Import.FBX=False

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
; The same PC shader target as the game (game/Config/DefaultEngine.ini), so that verify.py run with
; -AllowCommandletRendering -dx12 compiles the toon materials for D3D12 SM6 like the game does.
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12
-D3D12TargetedShaderFormats=PCD3D_SM5
+D3D12TargetedShaderFormats=PCD3D_SM6

